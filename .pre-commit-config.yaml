# 00-Check-Code-Convention.yml is excluded by default.
# If you want to use a different filename, exclude that filename explicitly in the action inputs.
# exclude-regex action input appends a "| pattern" line to this multiline block at runtime.
exclude: |
  (?x)
  # Build output
  .*/build/.*
  |
  # Silicon Labs SDK / generated / IDE paths
  .*/gecko_sdk.*/.*
  | .*/autogen/.*
  | .*simplicity.*/.*
  | .*/config/.*
  |
  # CI workflow (self-check)
  ^\.github/workflows/00-Check-Code-Convention\.yml$
  |
  # Project metadata
  .*\.slcp
  | .*\.slps
  | .*\.mak
  | .*\.pintool
  | .*\.code-workspace
  |
  # cmake_gcc: everything except CMakeLists.txt
  (?:^|.*/)cmake_gcc/(?!CMakeLists\.txt$).+
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
  - repo: https://github.com/AndrasZiegler/codespell-silabs
    rev: 31de321acee254d75eee05ac5e8e17aa2f9dee1a
    hooks:
      - id: codespell
        args: [--config, /action/tools/.codespell/.codespellrc]
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: uncrustify
        args:
          [
            -c,
            /action/tools/uncrustify/uncrustify.cfg,
            -lC,
            --no-backup,
            --replace,
          ]
      - id: clang-tidy
        args:
          - --config-file=/action/tools/.clang-tidy
          - --use-color
          - --extra-arg=-I/inc
          - --header-filter:'^((?!test).)*$'
          - -p=./build
